name: NoorQuran Android build
on:
  workflow_dispatch:
  push:
    branches: [main, feature/noorquran-original-vision, feature/quran-memorization-kids, feature/mushaf-library-experience]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android scaffold
        run: flutter create --platforms=android --project-name noor_quran .
      - name: Remove generated sample widget test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Verify Quran data
        run: python3 tools/verify_quran_bundle.py
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: NoorQuran-APK-Mushaf-Library
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
